<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Iron Hour</title>
<meta name="description" content="A workout playlist player for the gym." />
<link rel="icon" type="image/png" href="/fevicon.png" />
<link rel="apple-touch-icon" href="/fevicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="bg__layer" aria-hidden="true"></div>
  <div class="bg__scrim" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar__row">
      <span class="topbar__time" id="clock">--:--</span>
      <div class="presence" id="presence" aria-live="polite" hidden>
        <span class="presence__dot" aria-hidden="true"></span>
        <span class="presence__count" id="listeners">0</span>
        <span class="presence__label">on the grind</span>
      </div>
      <nav class="links" aria-label="Listen elsewhere">
        <a id="ytLink" href="#" target="_blank" rel="noopener" title="Open the playlist on YouTube" aria-label="Open the playlist on YouTube">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.5V8.5L15.8 12Z"/>
          </svg>
        </a>
      </nav>
    </div>
    <nav class="genre-tabs" role="tablist" aria-label="Playlist language">
      <button class="genre-tab" type="button" role="tab" data-genre="hindi" aria-selected="true">Hindi</button>
      <button class="genre-tab" type="button" role="tab" data-genre="phonk" aria-selected="false">Phonk</button>
      <button class="genre-tab" type="button" role="tab" data-genre="english" aria-selected="false">English</button>
    </nav>
  </header>

  <aside class="horns">
    <button id="hypeBtn" class="hype-btn" type="button" aria-label="Yeah buddy! Play hype sound">
      <span class="hype-btn__ring" aria-hidden="true"></span>
      <span class="hype-btn__ring hype-btn__ring--2" aria-hidden="true"></span>
      <span class="hype-btn__emoji" aria-hidden="true">&#128170;</span>
    </button>
  </aside>

  <audio id="hypeAudio" src="assets/yeah-buddy-lightweight.mp3" preload="auto"></audio>

  <main>
    <div class="dock">
      <section class="list" id="trackList" aria-label="Playlist">
        <ol id="trackListItems"></ol>
      </section>

      <p class="bumper" id="quote" aria-live="polite">Hit play and get to work.</p>

      <section class="player" aria-label="Player">
        <div class="disc" id="disc">
          <div class="disc__ring">
            <img id="art" class="disc__art" src="" alt="" />
          </div>
          <span class="disc__hub" aria-hidden="true"></span>
        </div>
        <div class="player__info">
          <p class="player__title" id="trackTitle">Loading the rack&hellip;</p>
          <p class="player__artist" id="trackArtist">&nbsp;</p>
          <div class="seek" id="seek" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="seek__rail"><div class="seek__fill" id="seekFill"></div></div>
            <div class="seek__knob" id="seekKnob"></div>
          </div>
          <div class="time"><span id="curTime">0:00</span> / <span id="durTime">0:00</span></div>
        </div>
        <div class="player__controls">
          <button id="shuffleBtn" type="button" title="Shuffle" aria-label="Shuffle">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M17 3h4v4h-2V6.4l-3.6 3.6-1.4-1.4L17.6 5H17V3ZM3 5h5.6l8.8 8.8 2.2-2.2 1.4 1.4-3.6 3.6-9.8-9.8H3V5Zm14 16v-2h.6l-3.2-3.2 1.4-1.4 3.2 3.2V17h2v4h-4ZM3 19h4.4l3-3-1.4-1.4-2.4 2.4H3v2Z"/></svg>
          </button>
          <button id="prevBtn" type="button" title="Previous track" aria-label="Previous track">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6 10-6v12z"/></svg>
          </button>
          <button id="playBtn" type="button" title="Play" aria-label="Play">
            <svg id="playIcon" viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" width="26" height="26" style="display:none"><path fill="currentColor" d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
          </button>
          <button id="nextBtn" type="button" title="Next track" aria-label="Next track">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6 10-6v12z" transform="scale(-1,1) translate(-24,0)"/></svg>
          </button>
          <button id="playlistBtn" type="button" title="Playlist" aria-label="Playlist">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M4 6h12v2H4V6zm0 5h12v2H4v-2zm0 5h8v2H4v-2zm14-8v9.5a2.5 2.5 0 1 1-2-2.45V8h-2V6h4z"/></svg>
          </button>
        </div>
      </section>
    </div>
  </main>

  <div id="ytPlayer"></div>

  <script src="tracks.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="script.js"></script>
</body>
</html>
